context:
  name: camber-toolkit
  version: "0.103.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace('-', '_') }}-${{ version }}.tar.gz
  sha256: a50ee0cf09fdc8991434146e33db0c77af470c7b6521a1d3d4d1fc99803701f0

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - camber = camber.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - numpy >=2.0,<3
    - pandas >=2.2.2,<3
    - matplotlib-base >=3.8.4
    - pyarrow >=16.0

tests:
  - python:
      imports:
        - camber
        - camber.mandv
        - camber.rules
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - camber --help

about:
  homepage: https://github.com/yroussev/camber
  repository: https://github.com/yroussev/camber
  documentation: https://yroussev.github.io/camber/
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: Vendor-neutral building-automation-system trend analysis (FDD, M&V, RCx)
  description: |
    CAMBER is a dependency-light, vendor-neutral toolkit for building-automation-system (BAS)
    trend analysis: fault detection & diagnostics (ASHRAE G36 / PNNL Re-tuning), measurement &
    verification (IPMVP A/B/C/D), and retro-commissioning, all speaking a common Role vocabulary.

extra:
  recipe-maintainers:
    - yroussev
